name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infomentor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p packages/infomentor-mcp/tsconfig.json
      - run: bunx tsc --noEmit -p packages/session-store/tsconfig.json
      - run: bun run lint
        working-directory: packages/infomentor-mcp
      - run: bun run lint
        working-directory: packages/session-store
      - run: bun test --timeout 30000
        working-directory: packages/infomentor-mcp
      - run: bun test --timeout 30000
        working-directory: packages/session-store
